services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      PORT: "8080"
      DATABASE_URL: postgres://gopherquest:gopherquest@postgres:5432/gopherquest?sslmode=disable
      GOPROXY_BASE_URL: https://proxy.golang.org
      HTTP_TIMEOUT: 5s
      DB_TIMEOUT: 3s
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: gopherquest
      POSTGRES_USER: gopherquest
      POSTGRES_PASSWORD: gopherquest
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./sql/schema/001_campaigns.sql:/docker-entrypoint-initdb.d/001_campaigns.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gopherquest -d gopherquest"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres-data:
